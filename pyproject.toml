[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portugal-medicines-mcp"
version = "0.1.0"
description = "MCP server for medicine shortages and pharmacies on duty in Portugal (public sources, read-only)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/ThiagoJacobLannes/portugal-medicines-mcp"

[project.scripts]
portugal-medicines-mcp = "portugal_medicines_mcp.server:main"

[tool.setuptools]
packages = ["portugal_medicines_mcp"]
